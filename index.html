<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Tracker</title>
  <meta name="description" content="Track subject-wise attendance and check exam eligibility against a minimum attendance rule.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1>Attendance Tracker</h1>
      <nav aria-label="Project documents">
        <a href="https://github.com/samruddhi-kadam07/SEProject/blob/main/docs/SRS.md">SRS</a>
        <a href="https://github.com/samruddhi-kadam07/SEProject/blob/main/docs/project-plan.md">Plan</a>
        <a href="https://github.com/samruddhi-kadam07/SEProject/blob/main/docs/design.md">Design</a>
        <a href="https://github.com/samruddhi-kadam07/SEProject/blob/main/docs/test-plan.md">Tests</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" aria-labelledby="summary-title">
      <div>
        <h2 id="summary-title">Overall attendance</h2>
        <p class="big" id="overall-pct">0%</p>
        <p class="muted" id="overall-detail">No classes recorded yet.</p>
      </div>
      <div class="summary-side">
        <span class="badge" id="overall-badge">No data</span>
        <form id="threshold-form" class="inline-form" novalidate>
          <label for="threshold-input">Minimum required (%)</label>
          <input id="threshold-input" type="number" min="1" max="99" step="1" inputmode="numeric">
          <button type="submit" class="btn secondary">Update</button>
        </form>
      </div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite" hidden></p>

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Add a subject</h2>
      <form id="add-form" class="add-form" novalidate>
        <div class="field grow">
          <label for="name-input">Subject name</label>
          <input id="name-input" type="text" maxlength="40" placeholder="e.g. Software Engineering" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="attended-input">Attended so far</label>
          <input id="attended-input" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label for="total-input">Classes held so far</label>
          <input id="total-input" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <button type="submit" class="btn primary">Add subject</button>
      </form>
    </section>

    <section aria-labelledby="subjects-title">
      <div class="section-head">
        <h2 id="subjects-title">Your subjects</h2>
        <button type="button" class="btn danger-outline" id="clear-btn">Clear all</button>
      </div>
      <p class="empty" id="empty-state">No subjects yet. Add one above to start tracking.</p>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <p>Software Engineering PBL project. Data is stored only in this browser.</p>
  </footer>

  <script src="js/attendance.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
